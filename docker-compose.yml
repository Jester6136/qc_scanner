# docker compose up --build -d   →   API sẵn sàng ở http://<IP-máy-này>:5000
#
# Máy có GPU NVIDIA → dùng file đè, xem docker-compose.gpu.yml:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build -d
#
# Hợp đồng API: docs/api.md
#
# ⚠️ Bản CPU đã build và chạy được trên máy server. Bản GPU thì CHƯA chạy thử lần nào
# (máy phát triển là macOS). Sau khi `up`, kiểm bằng:
#     curl -s http://localhost:5000/healthz
# `providers` phải có `CUDAExecutionProvider`; chỉ thấy `CPUExecutionProvider` nghĩa
# là onnxruntime đã âm thầm tụt về CPU — sai build, không phải chạy chậm.

services:
  qc-scanner:
    # Dạng dài (`context:`) chứ không phải `build: .` — để docker-compose.gpu.yml đè
    # `dockerfile:` lên được mà không phụ thuộc vào cách Compose chuẩn hoá chuỗi.
    build:
      context: .
    image: qc-scanner:local
    container_name: qc-scanner

    ports:
      # Mở ra LAN: service dựng ở máy A, ứng dụng gọi từ máy B → http://<IP-máy-A>:5000
      #
      # Cổng này mở trên MỌI giao diện mạng của máy A. Server có xác thực API key
      # (xem QC_SCANNER_API_KEYS bên dưới), nhưng key đi qua HTTP thuần là gửi mật
      # khẩu dạng chữ rõ — chặn được người gọi nhầm và người dò cổng, KHÔNG chặn
      # được người nghe lén trong LAN. Muốn kín thật thì đặt reverse proxy có TLS.
      # Máy A có IP public hoặc bị NAT port-forward thì vẫn phải chặn ở firewall.
      #
      # Chỉ dùng trên chính máy A thì đổi lại thành "127.0.0.1:5000:5000".
      #
      # ⚠️ Trên macOS, cổng 5000 bị **AirPlay Receiver** chiếm sẵn. Docker vẫn bind
      # được và container vẫn `healthy` (healthcheck chạy BÊN TRONG container), nhưng
      # gọi từ ngoài vào sẽ nhận `403 Forbidden` kèm header `Server: AirTunes/...`.
      # Cách nhận ra: `curl -sI http://localhost:5000/healthz | grep Server`.
      # Cách chữa: đặt cổng khác, ví dụ `QC_SCANNER_PORT=8000 docker compose up -d`
      # (hoặc tắt AirPlay Receiver trong System Settings → General → AirDrop & Handoff).
      - "${QC_SCANNER_PORT:-5000}:5000"

    environment:
      # ── BẮT BUỘC: không có key thì server KHÔNG khởi động ──────────────────
      # Sinh key:  docker compose run --rm qc-scanner qc-scanner-apikey app-web
      # Nhiều client thì nhiều key, ngăn cách bằng dấu phẩy — thu hồi được từng
      # cái, và log biết ai đang gọi:
      #     QC_SCANNER_API_KEYS: "app-web:qcs-…,batch:qcs-…"
      #
      # ⚠️ ĐỪNG ghi key thẳng vào file này rồi commit. Dùng biến của máy chạy:
      #     QC_SCANNER_API_KEYS="app-web:qcs-…" docker compose up -d
      QC_SCANNER_API_KEYS: "${QC_SCANNER_API_KEYS:?chưa đặt API key — chạy qc-scanner-apikey để sinh}"
      #
      # Chạy KHÔNG xác thực (chỉ khi cổng đã bị chặn ở firewall): bỏ dòng trên và
      # đặt QC_SCANNER_AUTH=off. Phải khai báo tường minh — không có đường vô tình.
      # ──────────────────────────────────────────────────────────────────────

      # Model đã nướng sẵn vào image lúc build → chạy được cả khi ngắt mạng.
      U2NET_HOME: /opt/u2net
      DOCALIGNER_HOME: /opt/docaligner
      # Mọi ngưỡng QC đều override được theo dạng QC_SCANNER_<TÊN_TRƯỜNG>;
      # danh sách đầy đủ nằm trong src/qc_scanner/config.py.
      QC_SCANNER_WORK_HEIGHT: "500"
      # Luồng xử lý kho ảnh thì đặt "operator" để hint không bảo người ta chụp lại
      # (QC-13). Mặc định "capturer" hợp với luồng realtime.
      QC_SCANNER_HINT_AUDIENCE: "capturer"
      # Origin được phép gọi từ trình duyệt; "*" là mọi origin. Thu hẹp khi biết
      # rõ app gọi vào chạy ở đâu, ví dụ "http://192.168.1.50:3000".
      QC_SCANNER_CORS_ORIGINS: "*"
      # KHÔNG đặt QC_SCANNER_MAX_CONCURRENCY ở đây — để `_default_concurrency()` suy
      # theo số nhân của máy đích.
      #
      # Chỗ này từng ghi cứng "2", và đó là con số đo trên máy dev 10 nhân lọt vào file
      # bàn giao. Hậu quả trên máy server 64 nhân: đường HTTP khoá ở 2.86 req/s trong
      # khi lõi chạy được 7.64 ảnh/s ở 16 luồng — **mất ~64% năng lực máy**, và mất im
      # lặng, vì service vẫn chạy đúng. Biến môi trường đè lên giá trị tự suy, nên đặt
      # ở đây là vô hiệu hoá hoàn toàn phép suy đó.
      #
      # Cần ép tay thì đặt lúc chạy, đừng ghi vào file dùng chung:
      #     QC_SCANNER_MAX_CONCURRENCY=24 docker compose up -d
      #
      # Trần bộ nhớ (số request đang bay) cũng tự suy — xem QC_SCANNER_MAX_IN_FLIGHT.

    restart: unless-stopped
    stop_grace_period: 20s

    healthcheck:
      # Dùng python thay vì curl: image python:3.12-slim không có curl, thêm curl
      # chỉ để làm healthcheck là thêm bề mặt tấn công cho không.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')"
      # start_period rộng tay: tiến trình nạp model vào RAM trước khi mở cổng.
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3

    tmpfs:
      - /tmp

    # Ảnh chỉ đi qua RAM, không ghi xuống đĩa (EX-12), nên về nguyên tắc hệ thống tệp
    # có thể để chỉ-đọc. ĐỂ TẮT vì chưa build thử được: nếu nó sai thì container chết
    # ngay lúc khởi động, mà mục tiêu của file này là `up` một phát là chạy. Bật lên
    # sau khi đã xác nhận image chạy bình thường.
    # read_only: true

    security_opt:
      - no-new-privileges:true
