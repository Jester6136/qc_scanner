name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Model rembg ~176MB: cache lại, nếu không mỗi lần chạy CI tải lại từ đầu
      # và bộ test E2E thành thứ không ai dám chạy.
      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-${{ runner.os }}

      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Cài sạch từ nguồn
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install .

      - run: ruff check src tests

      - name: Chạy test ngoài cây nguồn (bắt lỗi thiếu file trong package)
        run: python -m pytest
        working-directory: ${{ github.workspace }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install build && python -m build

      # Build xong chưa chứng minh được gì: phải cài lại wheel đó trên môi
      # trường sạch và gọi thử cả ba lệnh mới biết package có đủ file không.
      - name: Cài wheel và chạy thử cả ba lệnh
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/qc-scanner --help
          /tmp/smoke/bin/qc-scanner-batch --help
          /tmp/smoke/bin/qc-scanner-server --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
