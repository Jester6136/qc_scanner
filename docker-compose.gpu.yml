# Bản GPU NVIDIA (SPD-4) — file ĐÈ LÊN docker-compose.yml, không phải file rời.
#
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build -d
#
# Gõ dài thì đặt một lần cho cả phiên shell:
#
#     export COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#     docker compose up --build -d          # từ đây trở đi là bản GPU
#
# ⚠️ Vì sao là file đè chứ không phải `profiles: ["gpu"]` như bản trước:
# Compose quy định **service không khai `profiles` thì LUÔN chạy**. Nên
# `docker compose --profile gpu up` không *thay* bản CPU mà *thêm* bản GPU vào —
# hai container cùng đòi cổng 5000 và cái thứ hai chết với
# `Bind for 0.0.0.0:5000 failed: port is already allocated`.
# Đè lên **cùng một service** thì không thể chạy nhầm cả hai: chỉ có một `qc-scanner`.
#
# Yêu cầu phía host: driver NVIDIA + NVIDIA Container Toolkit. Kiểm TRƯỚC khi build
# (5 giây, thay vì phát hiện sau 15 phút):
#     docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
#
# Sau khi `up`, BẮT BUỘC xác nhận GPU thật sự đang chạy:
#     curl -s http://localhost:5000/healthz     # providers phải có CUDAExecutionProvider
# Chỉ thấy CPUExecutionProvider = build sai, KHÔNG phải chạy chậm. onnxruntime tụt về
# CPU trong im lặng: không lỗi, không cảnh báo, chỉ chậm gấp mấy chục lần.

services:
  qc-scanner:
    build:
      dockerfile: Dockerfile.gpu
    image: qc-scanner:gpu

    environment:
      # Khai báo tường minh thay vì để onnxruntime tự dò: muốn biết chắc mình đang
      # YÊU CẦU gì, rồi đối chiếu với cái `/healthz` báo là thật sự ĐANG CHẠY.
      # Vẫn giữ CPU ở cuối làm đường lui — chạy chậm còn hơn không chạy.
      QC_SCANNER_ONNX_PROVIDERS: "CUDAExecutionProvider,CPUExecutionProvider"
      # Không có GPU thì container CHẾT HẲN, không lặng lẽ chạy CPU.
      # Ở container dựng riêng cho GPU, "chạy được bằng CPU" không phải đường lui hợp
      # lệ — nó là lỗi cấu hình đang giả trang thành thành công, và nó sống được nhiều
      # tháng vì healthcheck vẫn xanh. Đã dính đúng lần dựng đầu trên máy H100.
      QC_SCANNER_REQUIRE_GPU: "1"
      # HAI van cho HAI tài nguyên khác nhau — đừng gộp.
      #
      # Đo trên H100 thật: phần CPU chiếm 62% thời gian mỗi ảnh, GPU 38%. Muốn nhanh
      # thì phải cho nhiều ảnh làm việc CPU song song → MAX_CONCURRENCY cao.
      # Nhưng VRAM là tài nguyên DÙNG CHUNG: trên chính máy đó một service vLLM đã
      # giữ 77.8/81.5 GB, chỉ chừa ~2.9GB. Thả 16 lần suy luận cùng lúc vào chỗ đó
      # thì nhận CUBLAS_STATUS_ALLOC_FAILED → GPU_CONCURRENCY phải thấp.
      #
      # Gộp làm một van thì luôn phải hy sinh một bên: hoặc bỏ phí 64 nhân CPU, hoặc
      # làm sập cả service vLLM bên cạnh.
      QC_SCANNER_MAX_CONCURRENCY: "16"
      QC_SCANNER_GPU_CONCURRENCY: "2"
      # Trần bộ nhớ GPU. Mặc định onnxruntime để arena tự lớn dần và có thể giành hết
      # phần còn trống — trên GPU dùng chung, đó là cách làm chết service bên cạnh.
      # 1536MB chọn theo ~2.9GB còn trống trên máy hiện tại; ĐO LẠI trên máy của bạn
      # bằng `nvidia-smi` rồi chỉnh, đừng chép nguyên con số này.
      QC_SCANNER_GPU_MEM_LIMIT_MB: "1536"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      # Rộng tay hơn bản CPU: lần khởi tạo CUDA context đầu tiên tốn thêm thời gian.
      start_period: 120s
